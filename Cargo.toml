[workspace]
resolver = "2"
members = [
  "crates/lare-core",
  "crates/lare-bunny",
  "apps/desktop/src-tauri",
]
# Added in later phases: "crates/lare-bunny", "crates/lare-transcribe",
# "apps/desktop/src-tauri", "crates/cap/*" (vendored Cap crates).

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/chaubenn/lare"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
