[workspace]
resolver = "2"
members = [
  "crates/lare-core",
  "crates/lare-bunny",
  "crates/cap/*",
  "apps/desktop/src-tauri",
]
exclude = [
  "crates/cap/vendor",
  "crates/cap/licenses",
]
# Added in later phases: "crates/lare-transcribe".

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/chaubenn/lare"
rust-version = "1.88"

# ---------------------------------------------------------------------------
# Workspace dependencies. The block below mirrors Cap's root Cargo.toml (the
# vendored crates in crates/cap use `workspace = true`), plus Lare's own.
# ---------------------------------------------------------------------------
[workspace.dependencies]
anyhow = { version = "1.0.86" }
cpal = { git = "https://github.com/CapSoftware/cpal", rev = "6013cb5f8bd3" }
ffmpeg = { package = "ffmpeg-next", git = "https://github.com/CapSoftware/rust-ffmpeg", rev = "49db1fede112" }
tokio = { version = "1.39.3", features = [
  "macros",
  "process",
  "fs",
  "sync",
  "rt",
  "rt-multi-thread",
  "time",
  "io-util",
  "net",
] }
specta = { version = "=2.0.0-rc.20", features = ["derive", "serde_json", "uuid", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nokhwa = { git = "https://github.com/CapSoftware/nokhwa", rev = "b9c8079e82e2", features = ["input-native", "serialize"] }
nokhwa-bindings-macos = { git = "https://github.com/CapSoftware/nokhwa", rev = "b9c8079e82e2" }
wgpu = { version = "25.0.0", features = ["wgpu-core"] }
wgpu-hal = "25.0.0"
wgpu-core = "25.0.0"
flume = "0.11.0"
thiserror = "2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3.31"
aho-corasick = "1.1.4"
cidre = { path = "crates/cap/vendor/cidre", features = [
  "macos_12_7",
  "cv",
  "cf",
  "cg",
  "core_audio",
  "sc",
  "av",
  "blocks",
  "async",
  "dispatch",
  "io_surface",
  "mtl",
  "vt",
  "vn",
], default-features = false }
windows = "0.60.0"
windows-core = "0.60"
windows-sys = "0.59.0"
windows-capture = "1.5.0"
percent-encoding = "2.3.1"
sysinfo = "0.32"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Cap's crates opt into these via `[lints] workspace = true`.
[workspace.lints.rust]
deprecated = "allow"
unexpected_cfgs = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
let_underscore_future = "deny"
unchecked_duration_subtraction = "deny"
collapsible_if = "deny"
clone_on_copy = "deny"
redundant_closure = "deny"
ptr_arg = "deny"
len_zero = "deny"
let_unit_value = "deny"
unnecessary_lazy_evaluations = "deny"
needless_range_loop = "deny"
manual_clamp = "deny"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
opt-level = 3

[patch.crates-io]
# Cap fork of cidre @ bf84b67079a8, vendored with a build.rs that does not need Xcode.
cidre = { path = "crates/cap/vendor/cidre" }
# https://github.com/gfx-rs/wgpu/pull/7550 (Cap carries a patched wgpu-hal 25.0.2)
wgpu-hal = { path = "crates/cap/vendor/wgpu-hal" }
