# What the overlay windows may call (granted in capabilities/overlays.json). build.rs generates an
# `allow-<command>` permission for every command registered in src/lib.rs, writes the
# `main-window` set (all of them) to main-window.toml, and refuses to build when a permission
# named here is not a registered command.

[[set]]
identifier = "overlay-windows"
description = "What the recorder pill and camera preview call: the recording status and settings, and the pill controls."
permissions = [
  "allow-recorder-status",
  "allow-recorder-settings",
  "allow-recording-pause",
  "allow-recording-resume",
  "allow-recording-stop",
  "allow-recording-cancel",
  "allow-tuck-recorder-window",
]
