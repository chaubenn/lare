[package]
name = "lare-desktop-protocol-tests"
version = "1.0.0"
edition = "2024"
publish = false

# Exercise the production socket module without linking the native capture GUI and FFmpeg.
[workspace]

[lib]
path = "lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
lare-core = { path = "../../../../crates/lare-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
