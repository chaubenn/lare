[package]
name = "lare-desktop"
version = "0.1.0"
description = "Lare desktop app: review drafts, publish posts, and (later) record demo videos and mock interviews."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "lare_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = "0.3"
futures = { workspace = true }
anyhow = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }

lare-core = { path = "../../../crates/lare-core" }
lare-recording = { path = "../../../crates/lare-recording" }
lare-transcribe = { path = "../../../crates/lare-transcribe" }
lare-bunny = { path = "../../../crates/lare-bunny" }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# `catch-all` turns Objective-C exceptions raised inside tao/wry/tauri calls into Rust panics
# with the exception message, instead of an opaque "cannot catch foreign exceptions" abort.
objc2 = { version = "0.6", features = ["catch-all"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
