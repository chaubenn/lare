[package]
name = "lare-transcribe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "whisper.cpp transcription for Lare: model download, ffmpeg audio decode, timestamped segments."

[dependencies]
whisper-rs = { version = "0.16", default-features = false }
ffmpeg = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }
