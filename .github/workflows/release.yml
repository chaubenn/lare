name: Release

# Push a tag `vX.Y.Z` (matching apps/desktop/src-tauri/tauri.conf.json `version`) to build signed
# updater bundles + installers for macOS (Apple Silicon + Intel) and Windows x64, plus the Chrome
# extension zip, and publish them as the GitHub "latest" release. The desktop app polls
# `releases/latest/download/latest.json` on launch and self-updates from it.
#
# `workflow_dispatch` builds everything into a draft release (never becomes "latest").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Public client configuration baked into the desktop bundle.
  VITE_SUPABASE_URL: https://jndqrvwkwoyvzoqcveev.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nsqHiRNIbrFvs1Y3nxpl3Q_xG2vqS9Q
  VITE_SITE_URL: https://lare-one.vercel.app
  VITE_BUNNY_LIBRARY_ID: "743884"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag + version
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match tauri.conf.json version $VERSION. Bump the version (apps/desktop/package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml) and re-tag."
              exit 1
            fi
          else
            TAG="manual-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Lare $TAG" --target "$GITHUB_SHA" --notes-file - <<'EOF'
          ## Download

          | Platform | File |
          | --- | --- |
          | macOS (Apple Silicon) | `Lare-macOS-AppleSilicon.dmg` |
          | macOS (Intel) | `Lare-macOS-Intel.dmg` |
          | Windows 10/11 (x64) | `Lare-Windows-x64-Setup.exe` |
          | Chrome extension | `Lare-Chrome-Extension.zip` |

          Builds are not notarised yet. macOS: right-click the app > Open the first time (or
          `xattr -dr com.apple.quarantine /Applications/Lare.app`). Windows: choose "More info"
          > "Run anyway" on the SmartScreen prompt.

          Installed apps update themselves from this release on launch. Setup guide:
          https://github.com/chaubenn/lare#install
          EOF
          fi
          # Drafts are not resolvable via /releases/tags/{tag} for a few seconds after
          # create (html_url is `untagged-*` even when tag_name is set). Wait until the
          # tag_name shows up in the list so later `gh release upload` calls do not 404.
          ID=""
          for attempt in 1 2 3 4 5 6; do
            ID=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
            [ -n "$ID" ] && break
            sleep 5
          done
          [ -n "$ID" ] || { echo "::error::draft $TAG did not become visible"; exit 1; }

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            asset: Lare-macOS-AppleSilicon.dmg
            glob: "target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            asset: Lare-macOS-Intel.dmg
            glob: "target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: Lare-Windows-x64-Setup.exe
            glob: "target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true
      - name: Native deps (prebuilt ffmpeg, cargo env)
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/setup-native-deps.mjs
      - name: Stable macOS signing identity (when configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        # macOS keys camera/mic/screen permissions to the code signature. Unsigned builds get a new
        # one every time, so each update revokes them. Only exported when set: an empty
        # APPLE_CERTIFICATE makes the bundler fail at "security import". See docs/releasing.md.
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE unset: macOS permissions reset on every update"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
      - name: Build and sign updater bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign). The matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Notarisation stays off; it additionally needs APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID.
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          # Do not pass releaseId. tauri-action's octokit uploader 500s on this repo
          # (GitHub unicorn HTML, "Error saving asset", "Error creating asset temp dir")
          # when three matrix jobs post large updater bundles at once. Attach with `gh`.
      - name: Attach installer and updater artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          GLOB: ${{ matrix.glob }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( $GLOB )
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no installer matched $GLOB"; exit 1; fi
          cp "${files[0]}" "$ASSET"
          upload=( "$ASSET" )
          macos=( "target/${TARGET}/release/bundle/macos/"*.app.tar.gz
                  "target/${TARGET}/release/bundle/macos/"*.app.tar.gz.sig )
          nsis=( "target/${TARGET}/release/bundle/nsis/"*-setup.exe
                 "target/${TARGET}/release/bundle/nsis/"*-setup.exe.sig )
          upload+=( "${macos[@]}" "${nsis[@]}" )
          if [ ${#upload[@]} -lt 3 ]; then
            echo "::error::missing updater artifacts for $TARGET (got: ${upload[*]})"
            find "target/${TARGET}/release/bundle" -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "Uploading: ${upload[*]}"
          for attempt in 1 2 3 4 5 6; do
            if gh release upload "$TAG" "${upload[@]}" --clobber; then
              exit 0
            fi
            echo "::warning::upload attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::gh release upload failed after retries"
          exit 1

  extension:
    name: Chrome extension
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and zip
        working-directory: apps/extension
        env:
          WXT_SUPABASE_URL: https://jndqrvwkwoyvzoqcveev.supabase.co
          WXT_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nsqHiRNIbrFvs1Y3nxpl3Q_xG2vqS9Q
          WXT_SITE_URL: https://lare-one.vercel.app
        run: pnpm build && pnpm zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-chrome-mv3
          path: apps/extension/.output/*.zip
          # wxt writes to `.output`, and upload-artifact skips dotted paths by default —
          # without this the step finds nothing and only warns.
          include-hidden-files: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          zip=$(ls apps/extension/.output/*-chrome.zip | head -n1)
          cp "$zip" Lare-Chrome-Extension.zip
          gh release upload "$TAG" Lare-Chrome-Extension.zip --clobber

  publish:
    name: Publish release
    needs: [create-release, desktop, extension]
    # Tag pushes become the public "latest" release (what the in-app updater reads).
    # Manual runs stay as drafts for inspection.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write latest.json, verify assets, undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p '*.sig' -D sigs
          python3 - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone
          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/latest/download"
          def entry(filename: str, sigfile: str) -> dict:
              sig = pathlib.Path("sigs", sigfile).read_text().strip()
              if not sig:
                  raise SystemExit(f"empty signature {sigfile}")
              return {"signature": sig, "url": f"{base}/{filename}"}
          darwin_arm = entry("Lare_aarch64.app.tar.gz", "Lare_aarch64.app.tar.gz.sig")
          darwin_x64 = entry("Lare_x64.app.tar.gz", "Lare_x64.app.tar.gz.sig")
          win = entry(f"Lare_{version}_x64-setup.exe", f"Lare_{version}_x64-setup.exe.sig")
          now = datetime.now(timezone.utc)
          pub = now.strftime("%Y-%m-%dT%H:%M:%S.") + f"{int(now.microsecond / 1000):03d}Z"
          pathlib.Path("latest.json").write_text(
              json.dumps(
                  {
                      "version": version,
                      "notes": "",
                      "pub_date": pub,
                      "platforms": {
                          "darwin-aarch64": darwin_arm,
                          "darwin-aarch64-app": darwin_arm,
                          "darwin-x86_64": darwin_x64,
                          "darwin-x86_64-app": darwin_x64,
                          "windows-x86_64": win,
                          "windows-x86_64-nsis": win,
                      },
                  },
                  indent=2,
              )
              + "\n"
          )
          PY
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | tee assets.txt
          for required in latest.json Lare-macOS-AppleSilicon.dmg Lare-macOS-Intel.dmg Lare-Windows-x64-Setup.exe Lare-Chrome-Extension.zip \
            Lare_aarch64.app.tar.gz Lare_aarch64.app.tar.gz.sig Lare_x64.app.tar.gz Lare_x64.app.tar.gz.sig \
            "Lare_${VERSION}_x64-setup.exe" "Lare_${VERSION}_x64-setup.exe.sig"; do
            grep -qx "$required" assets.txt || { echo "::error::missing asset $required"; exit 1; }
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Trim duplicate assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          # Keep only what people need to run the app — the four stable installers — plus
          # latest.json and the versioned updater artifacts it points at (setup exe + .sig,
          # .app.tar.gz + .sig). Everything else (duplicate dmgs, msi, raw extension zip) goes.
          for asset in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            case "$asset" in
              latest.json|Lare-macOS-*|Lare-Windows-x64-Setup.exe|Lare-Chrome-Extension.zip) continue ;;
              *_x64-setup.exe|*_x64-setup.exe.sig|*.app.tar.gz|*.app.tar.gz.sig) continue ;;
              *) gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done
