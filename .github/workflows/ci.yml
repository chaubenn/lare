name: CI

on:
  push:
    branches: [main]
  # Every PR, which in practice means dev -> main. Pushes to dev run the fast lane in
  # ci-dev.yml instead; this workflow is the slow one (~10 min warm) and is paid once, at the PR.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  js:
    # Builds run in the public repo only, where Actions minutes are free and the signing
    # secrets live. The private dev repo carries these files too (so both repos hold the same
    # tree) but leaves the repository variable PUBLIC_BUILDS unset, which skips the job.
    if: vars.PUBLIC_BUILDS == 'true'
    name: TypeScript (lint, typecheck, unit, extension e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r --if-present typecheck
      # Every package that has tests, not just @lare/shared: the desktop, web and capture
      # suites existed but nothing ran them.
      - run: pnpm -r --if-present test
      - name: Extension e2e (Playwright + Monaco fixture)
        working-directory: apps/extension
        # No `--with-deps`: the runner image already ships every shared library Chromium
        # needs, so all that flag added was an apt install of nine extra font packages, and
        # the job failed whenever the runner could not resolve Ubuntu's mirrors.
        run: |
          pnpm exec playwright install chromium
          pnpm build:e2e
          pnpm exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: extension-e2e-report
          path: apps/extension/test-results
      - name: Extension production build
        working-directory: apps/extension
        # The same public project settings the release workflows compile in; the build refuses
        # to run without them (`requireSupabaseEnv` in wxt.config.ts).
        env:
          WXT_SUPABASE_URL: https://jndqrvwkwoyvzoqcveev.supabase.co
          WXT_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nsqHiRNIbrFvs1Y3nxpl3Q_xG2vqS9Q
        run: pnpm build && pnpm zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-chrome-mv3
          path: apps/extension/.output/*.zip
          # wxt writes to `.output`, and upload-artifact skips dotted paths by default —
          # without this the step finds nothing and only warns.
          include-hidden-files: true

  rust:
    if: vars.PUBLIC_BUILDS == 'true'
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 ships the Visual Studio LLVM component bindgen needs (same runner Cap uses).
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (= v1), toolchain set by the input below
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          key: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Native deps (prebuilt ffmpeg, cargo env)
        env:
          RUST_TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/setup-native-deps.mjs
      - name: cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true
      - name: Check
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}
      - name: Test (portable crates)
        run: cargo test -p lare-core -p lare-bunny -p lare-transcribe -p scap-dxgi --target ${{ matrix.target }}
      - name: Clippy (Lare crates)
        run: cargo clippy -p lare-core -p lare-bunny -p lare-recording -p lare-transcribe -p lare-desktop --target ${{ matrix.target }} -- -D warnings
